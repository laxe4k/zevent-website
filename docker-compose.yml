services:
  api:
    build: ./backend
    environment:
      ZEVENT_UPSTREAM: ${ZEVENT_UPSTREAM:-https://zevent.fr/api/}
      ZEVENT_POLL_INTERVAL: ${ZEVENT_POLL_INTERVAL:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://web:3000}
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://api:8000}
    depends_on:
      - api
    restart: unless-stopped
